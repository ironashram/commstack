services:
  node_exporter:
    image: ghcr.io/prometheus/node-exporter:master-distroless@sha256:1cee9cbad1a66f9d2cd3bfdb5e63b65498e7709f4aafc0663ae1ca1360807f3c
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
      - '/var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro'
    command:
      - '--path.rootfs=/host'
      - '--collector.systemd'
      - '--collector.tcpstat'
      - '--collector.processes'
      - '--collector.cgroups'
    pid: host
    security_opt:
      - apparmor=unconfined
    network_mode: host

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: always
    ports:
      - "8080:8080"
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
