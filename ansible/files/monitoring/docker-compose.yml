services:
  node_exporter:
    image: ghcr.io/prometheus/node-exporter:master-distroless@sha256:246bc18e7a3c7161504c43c0ad3a058dcd9fd31dca2fc3b5e2f5565a36f017b4
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
      - '/var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro'
    command:
      - '--path.rootfs=/host'
      - '--collector.systemd'
      - '--collector.tcpstat'
      - '--collector.processes'
      - '--collector.cgroups'
    pid: host
    security_opt:
      - apparmor=unconfined
    network_mode: host

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    container_name: cadvisor
    restart: always
    ports:
      - "8080:8080"
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
