services:
  node_exporter:
    image: ghcr.io/prometheus/node-exporter:master-distroless@sha256:db696f2456ba68d1e2d566ea39ea8284d15bc475aab014acfeb85b0b89ca4e9c
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
      - '/var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro'
    command:
      - '--path.rootfs=/host'
      - '--collector.systemd'
      - '--collector.tcpstat'
      - '--collector.processes'
      - '--collector.cgroups'
    pid: host
    security_opt:
      - apparmor=unconfined
    network_mode: host

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.0
    container_name: cadvisor
    restart: always
    ports:
      - "8080:8080"
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
