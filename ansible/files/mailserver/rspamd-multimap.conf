BRAND_FROM_DOMAIN {
  type = "header";
  header = "From";
  filter = "email:domain:tld";
  map = "/etc/rspamd/local.d/brand_domains.map";
  score = 0.0;
  description = "From domain belongs to an impersonated brand";
}

BRAND_DISPLAY_NAME_SPOOF {
  type = "header";
  header = "From";
  filter = "email:name";
  regexp = true;
  map = "/etc/rspamd/local.d/brand_display_names.map";
  require_symbols = "!BRAND_FROM_DOMAIN";
  score = 9.0;
  description = "From display name claims a brand the From domain does not belong to";
}
