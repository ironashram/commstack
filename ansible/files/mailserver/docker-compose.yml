services:
  mailserver:
    image: ghcr.io/ironashram/docker-mailserver:edge@sha256:6f4d4bf63c0d102c3e1c99266e9cbc1b3f2d367ddedd18a414b280b1d49d2288
    container_name: mailserver
    hostname: "{{ mail_host }}"
    env_file: mailserver.env
    volumes:
      - /docker/mail/mail-data/:/var/mail/
      - /docker/mail/mail-state/:/var/mail-state/
      - /docker/mail/mail-logs/:/var/log/mail/
      - /docker/mail/config/:/tmp/docker-mailserver/
      - /docker/mail/fail2ban-jail.local:/etc/fail2ban/jail.d/user-jail.local:ro
      - /docker/mail/rspamd-dkim_signing.conf:/etc/rspamd/override.d/dkim_signing.conf:ro
      - /docker/mail/rspamd-dkim.private:/etc/rspamd/dkim/mail.private:ro
      - /docker/mail/rspamd-options.inc:/etc/rspamd/override.d/options.inc:ro
      - /docker/mail/rspamd-multimap.conf:/etc/rspamd/local.d/multimap.conf:ro
      - /docker/mail/rspamd-brand_display_names.map:/etc/rspamd/local.d/brand_display_names.map:ro
      - /docker/mail/rspamd-brand_domains.map:/etc/rspamd/local.d/brand_domains.map:ro
      - /etc/localtime:/etc/localtime:ro
      - /docker/certbot/certbot_etc:/etc/letsencrypt
    restart: always
    stop_grace_period: 1m
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: "ss --listening --tcp | grep -P 'LISTEN.+:smtp' || exit 1"
      timeout: 3s
      retries: 0
    network_mode: host
